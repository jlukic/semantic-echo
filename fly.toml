app = 'semanticui-echo'
primary_region = 'iad'

[build]

# UDP external and internal ports must match: Fly's proxy forwards UDP without
# rewriting the destination port, so a mismatch silently black-holes the
# handshake. Every rung binds fly-global-services (see start.sh), which is the
# only interface Fly delivers public UDP on.
[[services]]
  protocol = 'udp'
  internal_port = 4433
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 4433

# the flow-control probe: a 64 MiB session budget so one connection can cross the
# lines where WebKit stops returning credit (bug 319818), one session per address
[[services]]
  protocol = 'udp'
  internal_port = 4441
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 4441

# the same endpoint on the default port, for clients that may only ever dial 443
[[services]]
  protocol = 'udp'
  internal_port = 443
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 443

# rung A: webtransport-go v0.11.0 on quic-go v0.60.0
[[services]]
  protocol = 'udp'
  internal_port = 4436
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 4436

# the A/B twin of 4436: same binary, same settings, self-signed leaf pinned by hash
[[services]]
  protocol = 'udp'
  internal_port = 4437
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 4437

# the same pinned listener again, with CertSign added to the leaf's KeyUsage
[[services]]
  protocol = 'udp'
  internal_port = 4439
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 4439

# and again on the port the production lane uses, leaf unchanged
[[services]]
  protocol = 'udp'
  internal_port = 6443
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 6443

# the v0.12 control again, this time configured to send the flow-control trio
[[services]]
  protocol = 'udp'
  internal_port = 4440
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 4440

# rung B: rust wtransport over quinn
[[services]]
  protocol = 'udp'
  internal_port = 4438
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 4438

# the page, on plain https with no port in the URL. TLS stays with the app so it
# serves the same Let's Encrypt chain the WT ports do, which rules the tls
# handler out. proxy_proto is the one handler in play: without it the app sees
# Fly's proxy rather than the client, and the page cannot match a session to the
# connection asking about it
[[services]]
  protocol = 'tcp'
  internal_port = 4434
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 443
    handlers = ['proxy_proto']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
