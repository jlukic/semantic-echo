app = 'semanticui-echo'
primary_region = 'iad'

[build]

# UDP external and internal ports must match: Fly's proxy forwards UDP without
# rewriting the destination port, so a mismatch silently black-holes the
# handshake. Every rung binds fly-global-services (see start.sh), which is the
# only interface Fly delivers public UDP on.
[[services]]
  protocol = 'udp'
  internal_port = 4433
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 4433

# the same endpoint on the default port, for clients that may only ever dial 443
[[services]]
  protocol = 'udp'
  internal_port = 443
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 443

# rung A: webtransport-go v0.11.0 on quic-go v0.60.0
[[services]]
  protocol = 'udp'
  internal_port = 4436
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 4436

# the A/B twin of 4436: same binary, same settings, self-signed leaf pinned by hash
[[services]]
  protocol = 'udp'
  internal_port = 4437
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 4437

# rung B: rust wtransport over quinn
[[services]]
  protocol = 'udp'
  internal_port = 4438
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 4438

# the probe page, on plain https with no port in the URL. raw TCP passthrough
# with no handlers on purpose: the app terminates TLS itself with the Let's
# Encrypt chain, and the same chain has to be what the WT port serves
[[services]]
  protocol = 'tcp'
  internal_port = 4434
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 443

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
