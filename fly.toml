app = 'semanticui-echo'
primary_region = 'iad'

[build]

# UDP external and internal ports must match: Fly's proxy forwards UDP without
# rewriting the destination port, so a mismatch silently black-holes the
# handshake. The app binds fly-global-services (see the Dockerfile CMD), which
# is the only interface Fly delivers public UDP on.
[[services]]
  protocol = 'udp'
  internal_port = 4433
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 4433

# the probe page. no TLS handler on purpose: the app terminates TLS itself with
# the Let's Encrypt chain, and the same chain has to be what the WT port serves
[[services]]
  protocol = 'tcp'
  internal_port = 4434
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 4434

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
